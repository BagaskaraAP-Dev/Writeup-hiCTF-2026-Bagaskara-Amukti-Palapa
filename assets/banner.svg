  <g font-size="14" font-weight="600">
    <rect x="50" y="235" width="100" height="30" rx="15" fill="#132a1a" stroke="#238636"/>
    <text x="100" y="255" fill="#3fb950" text-anchor="middle">Steganography</text>
    <rect x="162" y="235" width="112" height="30" rx="15" fill="#10233f" stroke="#1f6feb"/>
    <text x="218" y="255" fill="#58a6ff" text-anchor="middle">Cryptography ×3</text>
    <rect x="286" y="235" width="150" height="30" rx="15" fill="#20152e" stroke="#8957e5"/>
    <text x="361" y="255" fill="#bc8cff" text-anchor="middle">Reverse Engineering ×2</text>
    <rect x="448" y="235" width="86" height="30" rx="15" fill="#0f2a1c" stroke="#2ea043"/>
